# Production-shaped stack for the Zep Underwriting Context Assembly.
#
#   docker compose up --build
#
# opens the console at http://localhost:8000 — fully wired, no host
# state: brief records and graph checkpoints live in PostgreSQL
# (db), source documents in object storage (minio), and the
# brief/retrieval cache plus ingestion locks in Redis (redis) —
# an accelerator only; the api serves correctly, just uncached,
# if Redis is down. The context graph itself is Zep (hosted, via
# CONTEXT_BACKEND=zep + ZEP_API_KEY) or the labelled offline
# adapter. The api service is stateless; scale it by adding
# replicas against the same db/minio/redis.
#
# The default context backend below is the offline adapter so the
# stack runs with no keys at all. For the real Zep profile:
#   CONTEXT_BACKEND=zep ZEP_API_KEY=... docker compose up --build
#
# Credentials below are local-stack defaults for this reference
# stack, overridable via the environment. A real deployment injects
# them from a secrets manager and puts TLS in front of every hop —
# see "What a production deploy still needs" in docs/architecture.md.

services:
  api:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      CONTEXT_BACKEND: ${CONTEXT_BACKEND:-offline}
      ZEP_API_KEY: ${ZEP_API_KEY:-}
      ZEP_API_BASE_URL: ${ZEP_API_BASE_URL:-https://api.getzep.com/api/v4}
      DATABASE_URL: <redacted>
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:8333
      S3_BUCKET: underwriting-context-documents
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  db:
    # PostgreSQL 16 + pgvector: brief records and graph checkpoints.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: zepcontext
      POSTGRES_PASSWORD: <redacted>
      POSTGRES_DB: zepcontext
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zepcontext -d zepcontext"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    # The brief/retrieval cache + ingestion coordination locks.
    # Cache only — nothing here is a source of truth, so no volume:
    # a cold cache is a correct cache, just a slower first brief.
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # S3-compatible object storage for source documents. MinIO Inc.
  # locked public pulls of minio/minio behind a login/license in
  # 2025, so this runs SeaweedFS's S3 gateway instead — same
  # path-style PUT/GET/HEAD API this app's S3 client needs. Service
  # name stays `minio` so S3_ENDPOINT_URL above doesn't need to
  # change; only the port (9000 -> 8333) does.
  minio:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -dir=/data -ip=0.0.0.0
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8333/"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio-init:
    # One-shot: create the documents bucket, then exit. SeaweedFS's S3
    # gateway doesn't enforce SigV4 auth in this unconfigured mode, so
    # a plain unsigned PUT is enough (no mc / MinIO CLI needed).
    image: curlimages/curl:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["sh", "-c", "code=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT http://minio:8333/underwriting-context-documents); case $$code in 200|204|409) exit 0 ;; *) echo \"bucket create failed: HTTP $$code\" >&2; exit 1 ;; esac"]

volumes:
  pgdata:
  miniodata:
